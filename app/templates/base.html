<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · 拾阶</title>
  <link rel="stylesheet" href="{{ url_for('static', path='bootstrap.min.css').path }}">
</head>
<body>
  <nav class="navbar navbar-default" aria-label="主导航">
    <div class="container">
      <a class="navbar-brand" href="{{ '/members' if member else '/login' }}">拾阶</a>
      <div class="navbar-right">
        {% if member %}
          <a class="btn btn-link navbar-btn" href="/members">会员</a>
          <a class="btn btn-link navbar-btn" href="/me/password">修改密码</a>
          <form class="navbar-form navbar-right" method="post" action="/auth/logout">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="btn btn-default">登出</button>
          </form>
        {% else %}
          <a class="btn btn-link navbar-btn" href="/login">登录</a>
          <a class="btn btn-link navbar-btn" href="/apply">入会申请</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container">
    {% if error_message %}
    <div class="alert alert-danger" role="alert" data-error-code="{{ error_code }}">
      {{ error_message }}（{{ error_code }}）
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
