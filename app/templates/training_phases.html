{% extends "base.html" %}
{% block title %}训练阶段{% endblock %}
{% block content %}
<h1>训练阶段</h1>

<section class="panel panel-default">
  <div class="panel-heading">新建阶段</div>
  <div class="panel-body">
    <form method="post" action="/training-phases">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
        <label for="p-plan">所属计划</label>
        <select id="p-plan" class="form-control" name="plan_id" required>
          {% for plan in plans %}<option value="{{ plan.id }}">{{ plan.term }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="p-name">阶段名称</label>
        <input id="p-name" class="form-control" name="name" required maxlength="40"
               placeholder="基础 / 强化 / 冲刺">
      </div>
      <div class="form-group">
        <label for="p-start">开始日期</label>
        <input id="p-start" class="form-control" name="start_on" type="date" required>
      </div>
      <div class="form-group">
        <label for="p-end">结束日期</label>
        <input id="p-end" class="form-control" name="end_on" type="date" required>
      </div>
      <button type="submit" class="btn btn-primary">保存阶段</button>
    </form>
  </div>
</section>

<div class="table-responsive">
  <table class="table table-striped">
    <thead><tr><th>计划</th><th>阶段</th><th>开始日期</th><th>结束日期</th></tr></thead>
    <tbody>
      {% for item in phases["items"] %}
      <tr>
        <td><a href="/training-plans">{{ item.plan_term }}</a></td>
        <td>{{ item.name }}</td>
        <td>{{ item.start_on }}</td>
        <td>{{ item.end_on }}</td>
      </tr>
      {% else %}
      <tr><td colspan="4">暂无数据</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
