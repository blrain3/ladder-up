{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<div class="row"><div class="col-sm-6 col-md-4">
  <h1>修改密码</h1>
  <form method="post" action="/me/password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="mb-3">
      <label class="form-label" for="old-password">旧密码</label>
      <input class="form-control" id="old-password" name="old_password" type="password" autocomplete="current-password" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="new-password">新密码</label>
      <input class="form-control" id="new-password" name="new_password" type="password" autocomplete="new-password" required>
    </div>
    <button class="btn btn-primary" type="submit"><i class="bi bi-key" aria-hidden="true"></i> 保存密码</button>
  </form>
</div></div>
{% endblock %}
