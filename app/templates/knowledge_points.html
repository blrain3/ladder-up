{% extends "base.html" %}
{% block title %}知识点{% endblock %}
{% block content %}
<h1>知识点树</h1>

<section class="panel panel-default">
  <div class="panel-heading">新建知识点</div>
  <div class="panel-body">
    <form method="post" action="/knowledge-points" class="form-inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
        <label for="kp-name">名称</label>
        <input id="kp-name" class="form-control" name="name" required maxlength="40">
      </div>
      <div class="form-group">
        <label for="kp-parent">父级</label>
        <select id="kp-parent" class="form-control" name="parent_id">
          <option value="">（作为根节点）</option>
          {% for item in tree["items"] %}
          <option value="{{ item.id }}">{{ '　' * (item.depth - 1) }}{{ item.name }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-primary">新建</button>
    </form>
  </div>
</section>

<div class="table-responsive">
  <table class="table table-striped">
    <thead><tr><th>名称</th><th>难度</th><th>题量</th><th>移动 / 删除</th></tr></thead>
    <tbody>
      {% for item in tree["items"] %}
      <tr>
        <td style="padding-left: {{ (item.depth - 1) * 24 }}px">{{ item.name }}</td>
        <td>{{ item.difficulty }}</td>
        <td>{{ item.problem_count }}</td>
        <td>
          <form method="post" action="/knowledge-points/{{ item.id }}/move" class="form-inline">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input class="form-control" name="parent_id" placeholder="父级 ID，留空移到根" size="16">
            <button type="submit" class="btn btn-default btn-xs">移动</button>
          </form>
          <form method="post" action="/knowledge-points/{{ item.id }}/delete">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="btn btn-danger btn-xs"
                    onclick="return confirm('确认删除该叶子知识点？')">删除</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4">暂无知识点</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
