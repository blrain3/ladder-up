{% extends "base.html" %}
{% block title %}知识点{% endblock %}
{% block content %}
<h1>知识点树</h1>

<section class="card">
  <div class="card-header"><i class="bi bi-plus-circle" aria-hidden="true"></i> 新建知识点</div>
  <div class="card-body">
    <form method="post" action="/knowledge-points" class="d-flex flex-wrap gap-2 align-items-end">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label class="form-label" for="kp-name">名称</label>
        <input id="kp-name" class="form-control" name="name" required maxlength="40">
      </div>
      <div class="mb-3">
        <label class="form-label" for="kp-parent">父级</label>
        <select id="kp-parent" class="form-select" name="parent_id">
          <option value="">（作为根节点）</option>
          {% for item in tree["items"] %}
          <option value="{{ item.id }}">{{ '　' * (item.depth - 1) }}{{ item.name }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-primary"><i class="bi bi-plus-lg" aria-hidden="true"></i> 新建</button>
    </form>
  </div>
</section>

<div class="table-responsive">
  <table class="table table-sm table-hover align-middle">
    <caption class="visually-hidden">知识点树</caption>
    <thead><tr><th>名称</th><th>难度</th><th>题量</th><th>移动 / 删除</th></tr></thead>
    <tbody>
      {% for item in tree["items"] %}
      <tr>
        <td class="knowledge-depth-{{ item.depth }}">{{ item.name }}</td>
        <td>{{ item.difficulty }}</td>
        <td>{{ item.problem_count }}</td>
        <td>
          <div class="d-flex gap-2">
            <form method="post" action="/knowledge-points/{{ item.id }}/move" class="d-flex gap-2">
              <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
              <input class="form-control" name="parent_id" placeholder="父级 ID，留空移到根" size="16">
              <button type="submit" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrows-move" aria-hidden="true"></i> 移动</button>
            </form>
            <form method="post" action="/knowledge-points/{{ item.id }}/delete">
              <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
              <button type="submit" class="btn btn-outline-danger btn-sm"
                      data-confirm="确定删除该叶子知识点？此操作不可撤销"><i class="bi bi-trash" aria-hidden="true"></i> 删除</button>
            </form>
          </div>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="text-muted"><i class="bi bi-inbox" aria-hidden="true"></i> 暂无知识点</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
