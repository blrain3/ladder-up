name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///data/app.db
      APP_ENV: ci
      SESSION_TTL_HOURS: "8"
      SEED_ADMIN_PASSWORD: CiAdmin123!
      SEED_DEMO_PASSWORD: CiDemo123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app bin tests scripts
      - name: Typecheck
        run: make typecheck
      - name: Migrate from empty
        run: |
          mkdir -p data
          alembic upgrade head
      - name: Test with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Smoke
        run: make smoke
